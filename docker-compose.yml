# Praktikum MG5-MG7: Kafka(Redpanda) -> MinIO -> Spark -> Iceberg
# Kredensial di bawah hanyalah DUMMY untuk lab lokal. Jangan dipakai di Internet/publik.
name: praktikum-mg5-mg7

services:
  redpanda:                   # Broker event; port internal 9092
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  console:                    # GUI Redpanda Console -> http://localhost:8088
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8088:8080"
    depends_on:
      - redpanda

  minio:                      # Penyimpanan objek S3-compatible; Console -> http://localhost:9001
    image: docker.io/pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: labadmin
      MINIO_ROOT_PASSWORD: labpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  rest:                       # Iceberg REST Catalog (metadata); file data disimpan di MinIO
    image: tabulario/iceberg-rest:1.6.0
    environment:
      AWS_ACCESS_KEY_ID: labadmin
      AWS_SECRET_ACCESS_KEY: labpassword123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    depends_on:
      - minio

  tools:                      # Python: producer, consumer, inspeksi, audit
    build:
      context: ./docker
      dockerfile: Dockerfile.tools
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: labadmin
      MINIO_SECRET_KEY: labpassword123
    volumes:
      - .:/app
    depends_on:
      - redpanda
      - minio

  spark:                      # Proses Spark; Web UI di http://localhost:4040
    build:
      context: ./docker
      dockerfile: Dockerfile.spark
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: labadmin
      MINIO_SECRET_KEY: labpassword123
      AWS_ACCESS_KEY_ID: labadmin
      AWS_SECRET_ACCESS_KEY: labpassword123
      AWS_REGION: us-east-1
      SPARK_DRIVER_MEMORY: 3g
    ports:
      - "4040:4040"
    volumes:
      - .:/app
      - spark-ivy:/root/.ivy2      # cache JAR Maven
    depends_on:
      - minio
      - rest

volumes:
  redpanda-data:
  minio-data:
  spark-ivy:
